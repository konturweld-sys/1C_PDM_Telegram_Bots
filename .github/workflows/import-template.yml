name: Import upstream binary template

on:
  push:
    paths:
      - ".github/workflows/import-template.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify original binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/KamranV21/1c-telegram-bot-management/5719f5c1730f7b9cb348280dd7065b18e26a1652/%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5_%D1%82%D0%BE%D1%80%D0%B3%D0%BE%D0%B2%D0%BB%D0%B5%D0%B9_%D0%B4%D0%B5%D0%BC%D0%BE_Telegram.TelegramBotManagement/src/CommonTemplates/%D0%A3%D0%91%D0%A2_%D0%98%D1%81%D1%85%D0%BE%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8%D0%9A%D0%BE%D0%B4%D0%B0/Template.bin"
          target="src/CommonTemplates/УБТ_ИсходникиКонсолиКода/Template.bin"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 --output "$target" "$url"
          actual_size="$(wc -c < "$target" | tr -d ' ')"
          actual_sha="$(git hash-object "$target")"
          test "$actual_size" = "1374576"
          test "$actual_sha" = "1b9d0c440d4b69b0f9b9cbf5a1e3f02575cbcbf6"
          echo "Verified original binary: size=$actual_size git_blob=$actual_sha"

      - name: Commit binary and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/CommonTemplates/УБТ_ИсходникиКонсолиКода/Template.bin"
          git rm ".github/workflows/import-template.yml"
          git commit -m "Import original binary code-console template"
          git push origin HEAD:main
