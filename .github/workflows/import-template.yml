name: Import upstream binary template

on:
  push:
    paths:
      - ".github/workflows/import-template.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify original binary
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/upstream.tar.gz"
          work="/tmp/upstream"
          url="https://codeload.github.com/KamranV21/1c-telegram-bot-management/tar.gz/5719f5c1730f7b9cb348280dd7065b18e26a1652"
          curl --fail --location --retry 3 --output "$archive" "$url"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          source_file="$(find "$work" -type f -path '*/src/CommonTemplates/УБТ_ИсходникиКонсолиКода/Template.bin' -print -quit)"
          test -n "$source_file"
          target="src/CommonTemplates/УБТ_ИсходникиКонсолиКода/Template.bin"
          mkdir -p "$(dirname "$target")"
          cp "$source_file" "$target"
          actual_size="$(wc -c < "$target" | tr -d ' ')"
          actual_sha="$(git hash-object "$target")"
          test "$actual_size" = "1374576"
          test "$actual_sha" = "1b9d0c440d4b69b0f9b9cbf5a1e3f02575cbcbf6"
          echo "Verified original binary: size=$actual_size git_blob=$actual_sha"

      - name: Commit binary and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/CommonTemplates/УБТ_ИсходникиКонсолиКода/Template.bin"
          git rm ".github/workflows/import-template.yml"
          git commit -m "Import original binary code-console template"
          git push origin HEAD:main
